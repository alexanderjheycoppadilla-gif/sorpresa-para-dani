<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Una sorpresa para ti ❤️</title><style>
:root{--gold:#d7b77a;--wine:#69283d;--cream:#f9ece4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#51243b,#171219 75%);color:var(--cream);font-family:Georgia,serif;text-align:center}main{max-width:650px;margin:auto;padding:45px 20px 70px}h1{font-weight:normal;font-size:clamp(30px,7vw,48px);color:var(--gold)}p{line-height:1.8}button{font:inherit;cursor:pointer;border:1px solid var(--gold);background:linear-gradient(135deg,#8c3c53,#4e1d30);color:white;border-radius:25px;padding:13px 22px;margin:8px;transition:.2s}button:hover{transform:translateY(-3px);box-shadow:0 5px 22px #d7b77a55}button:disabled{opacity:.45;cursor:not-allowed}.gift{font-size:110px;display:block;margin:25px auto;cursor:pointer;filter:drop-shadow(0 10px 25px #b47d7d77);animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-12px)}}.hidden{display:none}.panel{margin:22px auto;padding:24px;border:1px solid #d7b77a77;border-radius:20px;background:#ffffff0b;box-shadow:0 10px 35px #0003}.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}.card{width:115px;min-height:100px;display:grid;place-items:center;padding:12px;border:1px solid #d7b77a88;border-radius:14px;background:#ffffff0c;cursor:pointer}.card span{font-size:32px}.heart{position:fixed;top:-30px;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(45deg);opacity:0}}#tapheart{font-size:70px;display:inline-block;cursor:pointer;user-select:none;transition:transform .12s}#tapheart:active{transform:scale(1.25)}.letter{white-space:pre-line;text-align:left;line-height:2;font-style:italic}.small{color:#d6bba9;font-size:14px}.quiz-progress{display:flex;justify-content:center;gap:13px;margin:16px}.quiz-progress span{font-size:23px;color:#69505a}.quiz-progress span.active{color:#d7b77a}#quiz-options{display:flex;flex-direction:column;align-items:stretch;max-width:400px;margin:auto}#quiz-feedback{min-height:2em;color:#e7c0cc}#quiz-next button{background:linear-gradient(135deg,#9b6b3f,#6a283d)}
/* Pétalos discretos sobre el álbum */
#petal-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.petal{position:absolute;top:-25px;width:var(--size);height:calc(var(--size)*1.45);background:linear-gradient(135deg,#b9697d,#762c48 72%);border-radius:75% 5% 70% 30%;opacity:0;filter:drop-shadow(0 1px 1px #0003);animation:petal-fall var(--duration) linear var(--delay) infinite}
@keyframes petal-fall{0%{transform:translate3d(0,-25px,0) rotate(0);opacity:0}12%{opacity:var(--opacity)}85%{opacity:var(--opacity)}100%{transform:translate3d(var(--drift),105vh,0) rotate(var(--rotate));opacity:0}}
.memory-photo{display:block;width:100%;max-height:60vh;object-fit:contain;border-radius:12px;box-shadow:0 10px 32px #0007}.memory-caption{font-style:italic;color:#f4dce0}.memory-counter{color:var(--gold);font-size:14px;letter-spacing:2px}
@media(prefers-reduced-motion:reduce){.petal{animation:none;display:none}}
#music-toggle{position:fixed;right:14px;top:14px;z-index:50;background:#2a1927e8;border:1px solid var(--gold);border-radius:999px;padding:10px 14px;font-size:13px;box-shadow:0 3px 14px #0005}#music-toggle.hidden{display:none}

.reasons-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin:20px 0}.reason-tile{margin:0;min-height:105px;width:100%;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:linear-gradient(140deg,#51253c,#281a29);border:1px solid #d7b77a80;transition:background .2s,transform .2s}.reason-tile.revealed{background:linear-gradient(145deg,#734153,#3d2335);border-color:#e7bca4}.reason-tile .rose{font-size:27px}.reason-tile .reason-label{font-size:14px;line-height:1.35}.reason-count{color:#d7b77a;font-size:14px}.reason-finish{margin-top:14px}
/* Juego de corazones y ratoncitos */
.game-arena{height:clamp(300px,52vh,440px);position:relative;overflow:hidden;border:1px solid #d7b77a77;border-radius:18px;background:radial-gradient(circle at 55% 25%,#582b46,#241722 75%);touch-action:manipulation;user-select:none}
.game-item{position:absolute;left:0;top:0;width:60px;height:60px;display:grid;place-items:center;border:0;background:transparent;padding:0;margin:0;border-radius:50%;font-size:35px;cursor:pointer;will-change:transform;touch-action:none;filter:drop-shadow(0 2px 7px #0009);transition:none}
.game-item:active{filter:brightness(1.4)}.game-stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#f6d9df}.game-meter{height:9px;border-radius:30px;background:#4b3041;overflow:hidden}.game-meter-fill{height:100%;background:linear-gradient(90deg,#aa506b,#e9a7b7);transition:width .2s}.game-note{min-height:28px;color:#e9bac9;font-size:14px}

/* Carta final: retrato original suavizado y texto legible */
.letter-scene{position:relative;isolation:isolate;overflow:hidden;border-radius:22px;border:1px solid #d7b77a88;box-shadow:0 16px 50px #0008;margin:20px auto;padding:clamp(22px,5vw,42px) clamp(18px,5vw,42px);text-align:left;background:#281823}
.letter-scene::before{content:"";position:absolute;inset:0;z-index:-2;background-image:url('fondo_carta.jpg');background-size:cover;background-position:center 30%;opacity:.27;filter:saturate(.85)}
.letter-scene::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#281621d9,#281621b9 48%,#1a121be9)}
.letter-scene h2{text-align:center;color:#f2d7b4;margin:0 0 22px;font-size:clamp(25px,5vw,34px);line-height:1.3}
.letter-scene .letter{font-style:normal;white-space:pre-line;line-height:1.85;font-size:clamp(15px,3.6vw,18px);color:#fff1e9;text-shadow:0 1px 3px #0008;overflow-wrap:anywhere}
.letter-scene .letter-footer{text-align:center;color:#f0c9d2;margin:20px 0 0;font-style:italic}
</style></head><body><audio id="background-music" src="musica_dani.mp3" preload="auto" loop></audio><button id="music-toggle" class="hidden" onclick="toggleMusic()" aria-label="Pausar o reproducir música">♫ Pausar música</button><div id="petal-layer" aria-hidden="true"></div><main><div id="intro"><h1>Para ti, mi Dani ✨</h1><p>Hay regalos que no se compran... se crean con el corazón.</p><div class="gift" role="button" tabindex="0" onclick="start()" onkeydown="if(event.key==='Enter')start()">🎁</div><button onclick="start()">Abrir mi sorpresa</button></div><section id="experience" class="hidden"><h1>Para ti, mi Dani ♡</h1><p>Descubre estos cinco regalos. Cada uno guarda algo para ti.</p><div id="gifts" class="cards"></div><div id="content" class="panel hidden"></div><p id="progress" class="small"></p></section></main><script>
// PERSONALIZA ESTOS TEXTOS
const nombre='Dani';
const carta="Mi querida Dani, mi gordi ❤️\n\nQuería regalarte algo distinto, algo hecho con cariño y pensado solo para ti. Cada pregunta, cada fotografía y cada pequeño detalle de esta sorpresa guarda un pedacito de lo mucho que significas para mí.\n\nGracias por existir, por tus sonrisas y por todos esos momentos que hacen mis días más bonitos. Quiero que sepas que siempre deseo estar para ti: para cuidarte, escucharte, acompañarte y abrazarte cuando más lo necesites.\n\nSolo Dios sabe cuánto anhelo que seas tú para siempre, que sigamos caminando juntos y que, pase lo que pase, podamos elegirnos una y otra vez. Antes de conocerte sentía que me estaba ahogando entre tantas cosas; entonces llegaste tú y trajiste alegría, paz y felicidad a mi vida.\n\nMe has enseñado a tener paciencia, a discernir mejor cada momento, a acercarme más a Dios y a encontrar el lado bueno incluso en los días difíciles. Por eso te agradezco no solo por amarme, sino también por ayudarme a crecer.\n\nY sí, mi amor: si un día gano diez pesos, nueve son tuyos. ❤️ Porque compartir contigo lo poquito o lo mucho que tenga siempre será una alegría.\n\nSé que todavía somos jóvenes, pero eso me emociona: tenemos tantas páginas en blanco, tantos lugares por conocer, sueños por cumplir e historias por escribir. Confío en que, juntos y de la mano de Dios, podremos enfrentar lo que venga, porque una cuerda de tres dobleces no se rompe fácilmente.\n\nNo sé exactamente qué me deparará el futuro, ni dónde estaré dentro de algunos años. Pero hay algo que sí sé: cuando imagine ese futuro, quiero que estés tú ahí, a mi lado.\n\n¡TE AMOOOOOOOOOOOOOOOOOOOO, MI BERRINCHES! ❤️❤️❤️\n\nCon todo mi amor,\nEl hombre que más te AMA, J. A. ❤️\n\nSiempre tú. ♡";
const razones=["Tus ojitos chinos", "Tus labios hermosos", "Tu tamaño, mi peque", "Lo que cocinas, amor", "Tus berrinches, amor", "Tus celebraciones cuando te mimo", "Tu sonrisa de Grinch", "Tu pancita de Po", "Tus antojitos", "Tus nachas", "Tus besitos", "Tu manera de reír", "Tus abrazos reconfortantes", "Tus cachetes", "Lo que me recetas: ibuprofeno"];
let revealedReasons=new Set();
const questions=[
{q:'¿Dónde nos conocimos?',options:['Un bosque','De viaje','Un evento de modelaje','Un restaurante'],correct:2,message:'¡Sí, mi Dani! ❤️ Ahí comenzó nuestra hermosa historia.'},
{q:'¿Dónde y cuándo fue nuestra primera salida?',options:['1 de mayo, Parque Av. América','18 de abril, cine','19 de enero, en la piscina','15 de junio, en China'],correct:0,message:'¡Ese 1 de mayo siempre será un recuerdo especial! 💕'},
{q:'¿Cuál es nuestra actividad favorita?',options:['Ir de viaje','Salir a pasear','Ir a comer','Cocinar juntos','Estudiar juntos'],correct:2,message:'¡Así es! ❤️ Compartir comida contigo es uno de mis planes favoritos.'},
{q:'¿Cuál es nuestra comida favorita?',options:['Pastas y ravioles','Mariscos','Pizza','Hamburguesa','Conejo','Alitas'],correct:5,message:'¡Alitas! 🍗❤️ Y mucho mejor si las comemos juntos.'},
{q:'¿Cuál es la fecha de nuestro aniversario?',options:['15 de enero','16 de mayo','17 de octubre','18 de junio','25 de diciembre'],correct:3,message:'¡18 de junio! ❤️ Una fecha que siempre guardaré en mi corazón.'}
];
const memories=[
['recuerdo_1.jpg','Nuestra primera salida','Doy gracias por aquel día. En tu día especial, te diste tiempo para nosotros, y ese momento se convirtió en uno de mis recuerdos más bonitos. ❤️'],
['recuerdo_2.jpg','Noches mágicas','Verte dormir era el mejor regalo. Esos pequeños momentos a tu lado son los que hacen que mi mundo sea especial. 🌙'],
['recuerdo_3.jpg','Tus besos son lo más rico del mundo','Porque tus besos saben al amor de mi vida. Y si pudiera elegir un lugar para quedarme, sería siempre cerquita de ti. 💋'],
['recuerdo_4.jpg','Los años pasan, pero mi amor aumenta más','Quiero estar presente en cada uno de tus cumpleaños, celebrar tus sonrisas y acompañarte hasta que seamos viejitos. 🎂'],
['recuerdo_5.jpg','Mis dos amores','Las dos personas más especiales que tengo en este mundo. Un recuerdo que guardaré siempre en mi corazón. ❤️'],
['recuerdo_6.jpg','Juntos, tomados de la mano','Ante todo, quiero que enfrentemos cada dificultad juntos, sin soltarnos de la mano. Porque contigo quiero caminar por la vida. 🤝'],
['recuerdo_7.jpg','Cada salida a tu lado es única','Quiero recorrer y conocer todo el mundo a tu lado. Porque no importa el destino, mientras seas tú quien me acompañe. 🌍']
];
let memoryIndex=0;
function petals(on){const layer=document.getElementById('petal-layer');layer.replaceChildren();if(!on)return;for(let i=0;i<15;i++){const e=document.createElement('i');e.className='petal';e.style.left=(Math.random()*100)+'%';e.style.setProperty('--size',(4+Math.random()*4)+'px');e.style.setProperty('--duration',(10+Math.random()*9)+'s');e.style.setProperty('--delay',(-Math.random()*19)+'s');e.style.setProperty('--drift',((Math.random()-.5)*150)+'px');e.style.setProperty('--rotate',(200+Math.random()*540)+'deg');e.style.setProperty('--opacity',(.25+Math.random()*.35));layer.appendChild(e)}}
function showMemory(){const m=memories[memoryIndex];show(`<h2>7 recuerdos, una historia ❤️</h2><p class="memory-counter">RECUERDO ${memoryIndex+1} DE 7</p><img class="memory-photo" src="${m[0]}" alt="Recuerdo ${memoryIndex+1}: ${m[1]}"><h3>${m[1]}</h3><p class="memory-caption">${m[2]}</p><button onclick="advanceMemory()">${memoryIndex===6?'Desbloquear la siguiente sorpresa 🎁':'Siguiente recuerdo ❤️'}</button>`)}
function advanceMemory(){if(memoryIndex<6){memoryIndex++;showMemory()}else{petals(false);next(1)}}
let questionIndex=0, answered=false;
let unlocked=0, hearts=0;let gameFrame=0,gameItems=[],gameLast=0,gameStart=0,gameSpawn=0,gameActive=false,gameCount=0;const icons=['💗','📸','❤️','🌹','💌'];const names=['5 preguntas','Un recuerdo','Atrapa corazones','Lo que amo de ti','Mi carta'];
const music=document.getElementById('background-music');
music.volume=0.35;
function updateMusicButton(){document.getElementById('music-toggle').textContent=music.paused?'♫ Reproducir música':'♫ Pausar música'}
function toggleMusic(){if(music.paused){music.play().catch(()=>{});}else{music.pause()}updateMusicButton()}
music.addEventListener('play',updateMusicButton);music.addEventListener('pause',updateMusicButton);
function start(){document.getElementById('music-toggle').classList.remove('hidden');music.play().catch(()=>{updateMusicButton()});updateMusicButton();document.getElementById('intro').classList.add('hidden');document.getElementById('experience').classList.remove('hidden');render()}
function render(){let root=document.getElementById('gifts');root.innerHTML='';icons.forEach((ico,i)=>{let b=document.createElement('button');b.className='card';b.disabled=i>unlocked;b.innerHTML=`<span>${i>unlocked?'🔒':ico}</span><small>${names[i]}</small>`;b.onclick=()=>openGift(i);root.appendChild(b)});document.getElementById('progress').textContent=`Regalos desbloqueados: ${Math.min(unlocked+1,5)} de 5`}
function show(html){stopGame();let el=document.getElementById('content');el.classList.remove('hidden');el.innerHTML=html;el.scrollIntoView({behavior:'smooth',block:'nearest'})}
function next(i){unlocked=Math.max(unlocked,Math.min(4,i+1));render();show('<h2>¡Sorpresa descubierta! ✨</h2><p>Ya puedes abrir tu siguiente regalo.</p>');confetti()}
function showQuestion(){
 const q=questions[questionIndex];answered=false;
 show(`<h2>Un reto para Dani 💗</h2><p class="small">Pregunta ${questionIndex+1} de 5</p><div class="quiz-progress">${questions.map((_,i)=>`<span class="${i<=questionIndex?'active':''}">♥</span>`).join('')}</div><h3>${q.q}</h3><div id="quiz-options">${q.options.map((o,i)=>`<button onclick="answer(${i})">${o}</button>`).join('')}</div><p id="quiz-feedback" aria-live="polite"></p><div id="quiz-next"></div>`);
}
function answer(i){
 if(answered)return;
 const q=questions[questionIndex],feedback=document.getElementById('quiz-feedback');
 if(i!==q.correct){feedback.textContent='Casi, mi Dani 💗 Inténtalo otra vez, tú puedes.';return;}
 answered=true;feedback.textContent='¡Respuesta correcta! ❤️ '+q.message;
 document.querySelectorAll('#quiz-options button').forEach(b=>b.disabled=true);
 document.getElementById('quiz-next').innerHTML=`<button onclick="advanceQuestion()">${questionIndex===4?'Desbloquear el segundo regalo 🎁':'Siguiente ronda →'}</button>`;
}
function advanceQuestion(){if(questionIndex<4){questionIndex++;showQuestion()}else{next(0)}}
function openGift(i){if(i>unlocked)return;petals(i===1);if(i===0){if(unlocked>0)questionIndex=0;showQuestion()}if(i===1){memoryIndex=0;showMemory()}if(i===2){startHeartGame()}if(i===3){showReasons()}if(i===4){show('<section class="letter-scene"><h2>Una carta para ti 💌</h2><div class="letter" id="letter"></div></section>');typeLetter(carta);confetti()}}
function stopGame(){gameActive=false;if(gameFrame)cancelAnimationFrame(gameFrame);gameFrame=0;gameItems=[];gameLast=0}
function startHeartGame(){hearts=0;show(`<h2>¡Atrapa los corazones, Dani! ❤️🐭</h2><p>Los corazones se mueven y los ratoncitos son traviesos. ¡Evítalos!</p><div class="game-stats"><strong id="score">❤️ 0 / 10</strong><span>🐭 = −1 ❤️</span><span id="game-time">⏱ 0 s</span></div><div class="game-meter"><div id="game-meter-fill" class="game-meter-fill" style="width:0%"></div></div><p id="game-note" class="game-note" aria-live="polite">Atrapa 10 corazones para abrir el siguiente regalo.</p><div id="game-arena" class="game-arena" aria-label="Juego de atrapar corazones y evitar ratones"></div><p class="small">Los personajes cambian de dirección y se aceleran con el tiempo.</p>`);gameItems=[];gameActive=true;gameLast=0;gameStart=performance.now();gameSpawn=0;gameCount=0;gameFrame=requestAnimationFrame(gameLoop)}
function addGameItem(now){const arena=document.getElementById('game-arena');if(!arena)return;const mouse=Math.random()<.36;const el=document.createElement('button');el.type='button';el.className='game-item';el.textContent=mouse?'🐭':'❤️';el.setAttribute('aria-label',mouse?'Ratón: resta un corazón':'Corazón: suma un punto');const w=Math.max(10,arena.clientWidth-62),h=Math.max(10,arena.clientHeight-62);const speed=(80+Math.min(110,(now-gameStart)/240))* (0.8+Math.random()*.65);const angle=Math.random()*Math.PI*2;const item={el,mouse,x:Math.random()*w,y:Math.random()*h,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,until:now+3600+Math.random()*1600};el.addEventListener('pointerdown',(ev)=>{ev.preventDefault();ev.stopPropagation();hitGameItem(item)});el.addEventListener('click',(ev)=>ev.preventDefault());arena.appendChild(el);gameItems.push(item)}
function hitGameItem(item){if(!gameActive||!gameItems.includes(item))return;hearts=Math.max(0,Math.min(10,hearts+(item.mouse?-1:1)));item.el.remove();gameItems=gameItems.filter(x=>x!==item);document.getElementById('score').textContent='❤️ '+hearts+' / 10';document.getElementById('game-meter-fill').style.width=(hearts/10*100)+'%';document.getElementById('game-note').textContent=item.mouse?'HUY RATA MALVADA 🐭 −1 ❤️':'¡Bien atrapado, mi Dani! ❤️ +1 corazón';if(hearts>=10){stopGame();show('<h2>¡Lo lograste, mi Dani! 💖</h2><p>Atrapaste los 10 corazones a pesar de los ratoncitos traviesos.</p><button onclick="next(2)">Desbloquear el cuarto regalo 🌹</button>');confetti()}}
function gameLoop(now){if(!gameActive)return;const arena=document.getElementById('game-arena');if(!arena){stopGame();return}const dt=gameLast?Math.min(.045,(now-gameLast)/1000):0;gameLast=now;document.getElementById('game-time').textContent='⏱ '+Math.floor((now-gameStart)/1000)+' s';const interval=Math.max(430,1050-(now-gameStart)/65);if(now-gameSpawn>interval&&gameItems.length<8){addGameItem(now);gameSpawn=now}const w=Math.max(0,arena.clientWidth-60),h=Math.max(0,arena.clientHeight-60);for(const item of [...gameItems]){if(now>item.until){item.el.remove();gameItems=gameItems.filter(x=>x!==item);continue}item.x+=item.vx*dt;item.y+=item.vy*dt;if(item.x<0||item.x>w){item.vx*=-1;item.x=Math.max(0,Math.min(w,item.x))}if(item.y<0||item.y>h){item.vy*=-1;item.y=Math.max(0,Math.min(h,item.y))}if(Math.random()<.008){const angle=Math.random()*Math.PI*2;const speed=Math.hypot(item.vx,item.vy);item.vx=Math.cos(angle)*speed;item.vy=Math.sin(angle)*speed}item.el.style.transform=`translate3d(${item.x}px,${item.y}px,0)`}gameFrame=requestAnimationFrame(gameLoop)}
function showReasons(){revealedReasons=new Set();show('<h2>15 cosas que amo de ti, mi Dani 🌹</h2><p>Detrás de cada rosa hay algo que me encanta de ti. Tócalas para descubrirlo.</p><p id="reason-progress" class="reason-count">0 de 15 rosas descubiertas</p><div class="reasons-grid">'+razones.map((_,j)=>`<button class="reason-tile" id="reason${j}" onclick="reveal(${j})" aria-label="Descubrir razón ${j+1}"><span class="rose">🌹</span><span class="reason-label">Razón ${j+1}</span></button>`).join('')+'</div><div id="reason-finish" class="reason-finish"></div>')}
function reveal(i){const b=document.getElementById('reason'+i);if(!b||revealedReasons.has(i))return;revealedReasons.add(i);b.classList.add('revealed');b.innerHTML='<span class="rose">❤️</span><span class="reason-label"></span>';b.querySelector('.reason-label').textContent=razones[i];document.getElementById('reason-progress').textContent=revealedReasons.size+' de 15 rosas descubiertas';if(revealedReasons.size===15){document.getElementById('reason-finish').innerHTML='<p>¡Mi Dani, hay tantas cosas más que amo de ti! ❤️</p><button onclick="next(3)">Desbloquear mi carta para ti 💌</button>';confetti()}}
function typeLetter(t){let el=document.getElementById('letter'),i=0;function tick(){if(!el.isConnected)return;el.textContent=t.slice(0,i++);if(i<=t.length)setTimeout(tick,12)}tick()}
function confetti(){for(let i=0;i<24;i++){let e=document.createElement('div');e.className='heart';e.textContent=Math.random()>.5?'❤️':'✨';e.style.left=Math.random()*100+'vw';e.style.animationDuration=(2+Math.random()*3)+'s';e.style.animationDelay=Math.random()+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),6000)}}
</script></body></html>
